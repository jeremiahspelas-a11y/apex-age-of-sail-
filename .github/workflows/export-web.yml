name: Export Godot Web
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify original APEX V9 ship model
        run: |
          set -euo pipefail
          test -s assets/apex_pinnace_v9.glb.xz.base64
          base64 --decode assets/apex_pinnace_v9.glb.xz.base64 | xz --decompress > assets/apex_pinnace_v9.glb
          printf '%s  %s\n' 'a34a9b501de901a51871cef455d4c2bccd5bd924a73b03920c3b793c8316bfb6' assets/apex_pinnace_v9.glb | sha256sum --check --status
          test "$(wc -c < assets/apex_pinnace_v9.glb)" -eq 245044
          echo "Original 288-mesh APEX V9 ship restored and SHA-256 verified."
      - name: Verify required APEX source files
        run: |
          set -euo pipefail
          for f in project.godot physics_trial.tscn scripts/sea_trial.gd scripts/sailing_physics.gd assets/apex_pinnace_v9.glb; do
            if [ ! -s "$f" ]; then echo "::error file=$f::Missing required APEX game file"; exit 1; fi
          done
      - name: Install Godot and Web templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          unzip -p templates.tpz templates/web_nothreads_debug.zip > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip"
      - name: Import and export
        run: |
          test -f project.godot || { echo "APEX Godot project has not been uploaded"; exit 1; }
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script" godot-import.log; then echo "::error::Godot script import errors"; exit 1; fi
          mkdir -p web
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web web/index.html 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script" godot-export.log; then echo "::error::Godot script export errors"; exit 1; fi
          echo "Auditing original APEX rig before further construction"
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://scripts/audit_original_rig.gd 2>&1 | tee original-rig-audit.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|RIG AUDIT: original GLB unavailable" original-rig-audit.log; then echo "::error::Original rig audit failed"; exit 1; fi
          echo "Running APEX headless runtime smoke test"
          timeout 25s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 100 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script|Invalid call|Invalid access" godot-runtime.log; then echo "::error::Godot runtime errors"; exit 1; fi
          test -s web/index.wasm
          test -s web/index.pck
      - name: Verify Spatial QA interactions and God Mode state
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/spatial_qa_test.gd 2>&1 | tee spatial-qa-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" spatial-qa-test.log; then exit 1; fi
          grep -q "APEX SPATIAL QA TEST PASS" spatial-qa-test.log
      - name: Verify ship construction, articulation and walk routes
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/ship_construction_test.gd 2>&1 | tee ship-construction-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" ship-construction-test.log; then exit 1; fi
          grep -q "APEX SHIP CONSTRUCTION TEST PASS" ship-construction-test.log
      - name: Verify force-driven hull and loaded steering transmission
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/force_trial_test.gd 2>&1 | tee force-trial-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" force-trial-test.log; then exit 1; fi
          grep -q "APEX FORCE TRIAL TEST PASS" force-trial-test.log
      - name: Verify first-person deck trainer
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/trainer_test.gd 2>&1 | tee trainer-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" trainer-test.log; then exit 1; fi
          grep -q "APEX TRAINER TEST PASS" trainer-test.log
      - name: Verify loaded foreyard braces and panel pressure
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/yard_brace_test.gd 2>&1 | tee yard-brace-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" yard-brace-test.log; then exit 1; fi
          grep -q "APEX YARD BRACE TEST PASS" yard-brace-test.log
      - name: Verify deforming fore sail and clew-sheet load transfer
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/sail_membrane_test.gd 2>&1 | tee sail-membrane-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" sail-membrane-test.log; then exit 1; fi
          grep -q "APEX SAIL MEMBRANE TEST PASS" sail-membrane-test.log
      - name: Verify shared sea and procedural weather
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/environment_test.gd 2>&1 | tee environment-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" environment-test.log; then exit 1; fi
          grep -q "APEX ENVIRONMENT TEST PASS" environment-test.log
      - name: Verify optional VR input and desktop fallback
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/vr_input_test.gd 2>&1 | tee vr-input-test.log
          if grep -E "SCRIPT ERROR:|Parse Error:|ERROR:" vr-input-test.log; then exit 1; fi
          grep -q "APEX VR INPUT TEST PASS" vr-input-test.log
      - name: Verify co-op host, clients and stalled receiver
        run: python3 tests/run_coop_test.py ./Godot_v4.7.2-stable_linux.x86_64
      - name: Browser graphics smoke test and screenshots
        timeout-minutes: 10
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.2
          # Hosted runner currently reports ubuntu26.04; use supported browser platform.
          PLAYWRIGHT_HOST_PLATFORM_OVERRIDE=ubuntu24.04-x64 npx playwright install chromium
          sudo apt-get update
          sudo apt-get install -y libnss3 libnspr4 libatk-bridge2.0-0t64 libxkbcommon0 libgbm1 libasound2t64
          mkdir -p visual-qa
          node tests/browser_graphics.cjs
      - name: Verify two browser clients share the host ship
        timeout-minutes: 6
        run: node tests/browser_coop.cjs
      - name: Verify browser clew-sheet controls and deformed sail
        timeout-minutes: 5
        run: node tests/browser_cloth.cjs
      - name: Publish visible QA evidence with the game
        if: success()
        run: |
          mkdir -p web/qa
          cp visual-qa/initial.png web/qa/initial.png
          cp visual-qa/after-5s.png web/qa/after-5s.png
          cp visual-qa/report.json web/qa/report.json
          printf '%s\n' "${GITHUB_SHA}" > web/qa/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-visual-qa
          path: visual-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: apex-godot-web
          path: web/
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: web/
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
