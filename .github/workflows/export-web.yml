name: Export Godot Web
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and verify original APEX V9 ship model
        run: |
          set -euo pipefail
          test -s assets/apex_pinnace_v9.glb.xz.base64
          base64 --decode assets/apex_pinnace_v9.glb.xz.base64 | xz --decompress > assets/apex_pinnace_v9.glb
          printf '%s  %s\n' 'a34a9b501de901a51871cef455d4c2bccd5bd924a73b03920c3b793c8316bfb6' assets/apex_pinnace_v9.glb | sha256sum --check --status
          test "$(wc -c < assets/apex_pinnace_v9.glb)" -eq 245044
          echo "Original 288-mesh APEX V9 ship restored and SHA-256 verified."
      - name: Verify required APEX source files
        run: |
          set -euo pipefail
          for f in project.godot physics_trial.tscn scripts/sea_trial.gd scripts/sailing_physics.gd assets/apex_pinnace_v9.glb; do
            if [ ! -s "$f" ]; then echo "::error file=$f::Missing required APEX game file"; exit 1; fi
          done
      - name: Install Godot and Web templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable"
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -p templates.tpz templates/web_nothreads_release.zip > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_release.zip"
          unzip -p templates.tpz templates/web_nothreads_debug.zip > "$HOME/.local/share/godot/export_templates/4.7.2.stable/web_nothreads_debug.zip"
      - name: Import and export
        run: |
          test -f project.godot || { echo "APEX Godot project has not been uploaded"; exit 1; }
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script" godot-import.log; then echo "::error::Godot script import errors"; exit 1; fi
          mkdir -p web
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-release Web web/index.html 2>&1 | tee godot-export.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script" godot-export.log; then echo "::error::Godot script export errors"; exit 1; fi
          echo "Running APEX headless runtime smoke test"
          timeout 25s ./Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 100 2>&1 | tee godot-runtime.log
          if grep -E "SCRIPT ERROR:|SHADER ERROR:|Parse Error:|Failed to load script|Invalid call|Invalid access" godot-runtime.log; then echo "::error::Godot runtime errors"; exit 1; fi
          test -s web/index.wasm
          test -s web/index.pck
      - name: Browser graphics smoke test and screenshots
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.58.2
          npx playwright install --with-deps chromium
          mkdir -p visual-qa
          python3 -m http.server 8765 --directory web > visual-qa/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node <<'JS'
          const { chromium, devices } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ headless: true, args: ['--enable-webgl', '--use-gl=angle', '--use-angle=swiftshader', '--enable-unsafe-swiftshader'] });
            const context = await browser.newContext({ ...devices['Pixel 7'], viewport: { width: 960, height: 540 }, deviceScaleFactor: 1 });
            const page = await context.newPage();
            const errors = [];
            page.on('pageerror', e => errors.push('PAGE: ' + e.message));
            page.on('console', m => { if (m.type() === 'error') errors.push('CONSOLE: ' + m.text()); });
            await page.goto('http://127.0.0.1:8765/index.html', { waitUntil: 'domcontentloaded', timeout: 45000 });
            await page.waitForTimeout(16000);
            await page.screenshot({ path: 'visual-qa/initial.png' });
            await page.waitForTimeout(5000);
            await page.screenshot({ path: 'visual-qa/after-5s.png' });
            const canvas = await page.locator('canvas').count();
            require('fs').writeFileSync('visual-qa/report.json', JSON.stringify({ canvas, errors }, null, 2));
            await browser.close();
            if (!canvas || errors.some(e => /WebGL|shader|SCRIPT ERROR|uncaught|Failed to load/i.test(e))) process.exitCode = 1;
          })().catch(e => { console.error(e); process.exitCode = 1; });
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-visual-qa
          path: visual-qa/
      - uses: actions/upload-artifact@v4
        with:
          name: apex-godot-web
          path: web/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
